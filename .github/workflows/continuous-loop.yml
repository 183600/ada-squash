name: Continuous Loop

on:
  workflow_dispatch:
  # 每 5 分钟一次「心跳」+ 下面 concurrency 排队，保证「一个 job 结束后立刻触发下一个」：
  # 任何时刻组内最多 1 个 running + 1 个 pending；当前 run 无论以何种方式结束
  # （成功 / 失败 / 被取消 / runner 意外宕机），队列中的下一个 run 都会在几秒内开始。
  # 即使收尾的 self-dispatch 步骤被 GitHub 跳过（runner 宕机时连 if: always()
  # 步骤也不会执行），下一次心跳也能在 ≤5 分钟内补位续跑，链条永不断。
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */5 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python and test dependencies (gate)
        run: |
          set +e
          python3 --version
          python3 -m pip install --quiet --upgrade pip 2>/dev/null || true
          if python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu; then
            echo "[ok] CPU torch installed for the gate checks"
          elif python3 -m pip install --quiet torch; then
            echo "[ok] torch installed (default index)"
          else
            echo "[warn] torch install failed; gate degrades to syntax+pin checks only"
          fi
          python3 -m pip install --quiet numpy PyYAML pytest 2>/dev/null \
            || echo "[warn] numpy/PyYAML/pytest install failed; gate degrades further"
          python3 -c "import torch, numpy, yaml, pytest; print('deps OK')" 2>/dev/null \
            || echo "[warn] gate dependencies incomplete"

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Configure opencode (free models + tamper protection)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # opencode 自带的 OpenCode Zen 免费 provider 无需任何 API key；
          # 如需更高限额，可在仓库 secrets 里可选配置 OPENCODE_API_KEY。
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "[info] OPENCODE_API_KEY 已配置（用于提升免费模型限额）"
          else
            echo "[info] 未配置 OPENCODE_API_KEY，匿名使用免费模型（有速率限制）"
          fi
          mkdir -p ~/.config/opencode
          # 免费模型路径的基准配置（权限锁定）；NVIDIA 路径的配置由主循环的探测脚本
          # 以本文件为基础合并生成 opencode.nvidia.json（保留同样的权限锁定）。
          cat > ~/.config/opencode/opencode.free.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "LICENSE.*": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny",
                "docs/design_notes.md": "deny",
                "**/docs/design_notes.md": "deny",
                "ci_gate.py": "deny",
                "**/ci_gate.py": "deny",
                "tests/**": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git mv *LICENSE*": "deny",
                "shred *LICENSE*": "deny",
                "truncate *LICENSE*": "deny",
                "unlink *LICENSE*": "deny",
                "dd *of=LICENSE*": "deny",
                "find * -name *LICENSE*": "deny",
                "git push*": "deny",
                "git checkout --orphan*": "deny",
                "git switch --orphan*": "deny",
                "git filter-branch*": "deny",
                "git rebase*": "deny",
                "git branch -D*": "deny",
                "git update-ref*": "deny",
                "git symbolic-ref*": "deny",
                "git reflog*": "deny",
                "git gc*": "deny",
                "git remote add*": "deny",
                "git remote remove*": "deny",
                "git remote set-url*": "deny",
                "rm *design_notes*": "deny",
                "mv *design_notes*": "deny",
                "rm *ci_gate*": "deny",
                "mv *ci_gate*": "deny"
              }
            }
          }
          EOF
          cp -f ~/.config/opencode/opencode.free.json ~/.config/opencode/opencode.json
          echo "[guard] opencode 权限已锁定：edit/bash 对 .github/** 与 LICENSE 禁止操作"

          echo "=== OpenCode Zen 可用模型目录 ==="
          opencode models opencode 2>/dev/null \
            || opencode models 2>/dev/null | grep -F 'opencode/' \
            || echo "[warn] 暂时无法获取模型列表，将在运行时重试"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode for ~5 hours (5 phases per iteration)
        timeout-minutes: 300
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          OUT=/tmp/oc_out.log
          DEADLINE=$(( $(date +%s) + 5*3600 - 900 ))

          # ================= 五阶段提示词 =================
          PROMPT_PERF='优化代码的性能和显存占用，但必须严格遵守 docs/design_notes.md 中标记【固定】的设计决策：注意力主路径必须保持 F.scaled_dot_product_attention 标准基线（它是本研究的对照设施不是研究变量）；不得改动 generalized_softsign 的数值稳定语义（_MIN_P=1e-3、_MIN_ALPHA=1e-4、对 max(|x|,1) 取倒数、copysign 符号处理）；不得删除或绕过任何手写 fused autograd kernel；QKSquash 必须保持 tanh 压缩。性能优化只能在固定设计的约束内进行（内存布局、分块、缓存、原地操作等）。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。不要输出或写入"优化了哪些内容"的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug，如果有就修改代码。修复必须保持 docs/design_notes.md 中【固定】设计的实现方式与数值语义不变，不得借修复之名切换已固定的实现或做无意义的等价重写；不得削弱或删除 tests/ 中的对拍测试。每次修复后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'

          # ================= 科研方法改进阶段（sci）：提示词池，每次运行时随机选一个 =================
          # SCI_1 为通用提示词：只要求改进科研方法，不指定改进哪一方面；
          # SCI_2~SCI_6 各自只聚焦一个方面：实验设计与准备 / 数据处理 / 可复现性与工程规范 / 对比实验与消融 / 结果分析。
          PROMPT_SCI_1='改进这个项目的科研方法。改进必须严格遵守 docs/design_notes.md 中标记【固定】的设计决策，保持【固定】设计的实现方式与数值语义不变，不得借改进之名切换已固定的实现或做无意义的等价重写；不得削弱或删除 tests/ 中的对拍测试。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'
          PROMPT_SCI_2='从实验设计与准备的角度改进这个项目的科研方法：检查基线是否合理——不要一上来就用最复杂的模型，应先实现一个最简单的基线（如规则系统、线性模型、简单的 CNN/BERT）并对其充分调优，复杂创新模型必须显著战胜精心调优过的基线才有意义，没调过参的弱基线只能证明复杂模型比稻草人强；检查评估指标是否合理——类别不平衡时不能只看准确率，要看 F1-score、PR-AUC、ROC-AUC 等，极度不平衡（如 1:1000 以上）时优先看 PR-AUC（此时 ROC-AUC 会因负样本基数巨大、FPR 增长缓慢而给出过于乐观的分数），多分类场景必须注明 F1 用的是 macro、micro 还是 weighted（三者结果可能差异很大），指标要对齐研究目标（如推荐系统关注 NDCG、医学诊断关注召回率）；检查实验是否有明确的科学假设——每个改动前要想清楚假设是什么（例如引入注意力机制是为了解决长文本依赖问题），带着假设做实验，而不是盲目排列组合超参数。发现以上问题就实际修改代码与实验脚本来改进。改进必须严格遵守 docs/design_notes.md 中标记【固定】的设计决策，保持【固定】设计的实现方式与数值语义不变，不得借改进之名切换已固定的实现或做无意义的等价重写；不得削弱或删除 tests/ 中的对拍测试。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'
          PROMPT_SCI_3='从数据处理的角度改进这个项目的科研方法：坚决防止数据泄露——先划分训练集、验证集、测试集，再做标准化、归一化、填充缺失值或特征工程，所有统计量（均值、方差、最值等）只能在训练集上计算再应用到验证集和测试集（fit_transform 只用于训练集，验证集和测试集只做 transform），绝不能用全量数据计算均值方差后再划分；时序数据必须按时间先后划分（用过去的数据训练、未来的数据验证和测试，防止未来信息穿越；这里要求的是划分时不能随机打乱，划分完成后训练阶段对训练样本做 batch 级别的 shuffle 是允许且常见的）；群组数据（同一个体如同一用户、同一物体产生的多条样本）必须整体落在同一侧，train/val/test 任意两侧之间都不能交叉，否则群组信息会泄露。严禁在测试集上调参——训练集用于模型拟合，验证集用于挑超参数和早停，测试集必须尘封、只在最终确定模型后评估一次，反复在测试集上调整会让它变成隐式训练集。同时检查数据清洗流程是否覆盖标签噪声、NaN/Inf、重复样本、异常值以及训练集与测试集的分布偏移。发现以上问题就实际修改代码来改进。改进必须严格遵守 docs/design_notes.md 中标记【固定】的设计决策，保持【固定】设计的实现方式与数值语义不变，不得借改进之名切换已固定的实现或做无意义的等价重写；不得削弱或删除 tests/ 中的对拍测试。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'
          PROMPT_SCI_4='从可复现性与工程规范的角度改进这个项目的科研方法：检查随机种子是否全部固定——Python、NumPy、PyTorch/TensorFlow 以及 CUDA、dataloader 的种子都要固定（即使固定了种子，跨硬件架构也难完全复现，但至少要保证同一台机器上结果相对稳定）；补充过拟合小批量数据的 sanity check——训练大模型前先抽取一个小批次（一个 batch 或几十到几百条数据），关闭正则化和数据增强，观察训练损失能否迅速趋近于 0、分类任务准确率能否接近 100%；如果连小数据都无法过拟合，说明存在梯度没有反向传播、损失计算错误等严重 bug，不要盲目开始全量训练（注意这是必要不充分的检查，通过也不代表代码完全正确，数据增强、特征对齐、标签映射等 bug 仍可能漏网，还需配合中间结果检查）；改进实验追踪——不要手动记录实验，确保每轮实验都记录代码版本、超参数、随机种子、数据版本、训练曲线和最终结果，做到可复现、可追溯。发现以上问题就实际修改代码来改进。改进必须严格遵守 docs/design_notes.md 中标记【固定】的设计决策，保持【固定】设计的实现方式与数值语义不变，不得借改进之名切换已固定的实现或做无意义的等价重写；不得削弱或删除 tests/ 中的对拍测试。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'
