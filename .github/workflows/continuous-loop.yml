name: Continuous Loop

on:
  workflow_dispatch:
  # 每 15 分钟一次「心跳」+ 下面 concurrency 排队，保证「一个 job 结束后立刻触发下一个」：
  # 任何时刻组内最多 1 个 running + 1 个 pending；当前 run 无论以何种方式结束
  # （成功 / 失败 / 被取消 / runner 意外宕机），队列中的下一个 run 都会在几秒内开始。
  # 即使收尾的 self-dispatch 步骤被 GitHub 跳过（runner 宕机时连 if: always()
  # 步骤也不会执行），下一次心跳也能在 ≤15 分钟内补位续跑，链条永不断。
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */15 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # cache-dependency-path 只能列仓库里真实存在的依赖文件：
          # requirements-ci.txt（本次改造新增）+ requirements.txt（仓库已有）。
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt

      # npm 全局包缓存：本仓库没有 package-lock.json，无法用 setup-node 的 `cache: npm`
      # （它要求 lock 文件存在），因此直接缓存 ~/.npm，`npm i -g` 会复用其中的 tarball。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python CI deps (cached, non-fatal)
        run: |
          set +e
          # 预热 pip 缓存（上面的 setup-python 已按 requirements-ci.txt 挂上 cache: pip）；
          # 失败不致命：下面的 gate 步骤仍会按原有回退链自行安装依赖。
          python3 -m pip install --quiet --upgrade pip 2>/dev/null || true
          python3 -m pip install --quiet -r requirements-ci.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            || echo "[warn] requirements-ci.txt 安装失败（不致命，gate 步骤会自行安装依赖）"

      - name: Setup Python and test dependencies (gate)
        run: |
          set +e
          python3 --version
          python3 -m pip install --quiet --upgrade pip 2>/dev/null || true
          if python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu; then
            echo "[ok] CPU torch installed for the gate checks"
          elif python3 -m pip install --quiet torch; then
            echo "[ok] torch installed (default index)"
          else
            echo "[warn] torch install failed; gate degrades to syntax+pin checks only"
          fi
          python3 -m pip install --quiet numpy PyYAML pytest 2>/dev/null \
            || echo "[warn] numpy/PyYAML/pytest install failed; gate degrades further"
          python3 -c "import torch, numpy, yaml, pytest; print('deps OK')" 2>/dev/null \
            || echo "[warn] gate dependencies incomplete"

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install DeepSeek Harness (dsh)
        run: |
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          dsh --version

      - name: Configure dsh (DeepSeek official API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          [ -n "$DEEPSEEK_API_KEY" ] || { echo "[error] secrets.DEEPSEEK_API_KEY 未配置" >&2; exit 1; }
          echo "[info] dsh $(dsh --version) | provider=deepseek-official | model=deepseek-flash"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run dsh for ~3 hours (5 phases per iteration)
        timeout-minutes: 180
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          OUT=/tmp/oc_out.log
          # 单次 run 的硬预算：3 小时（step 上限 180 分钟，job 上限 200 分钟，
          # 这里留 10 分钟给收尾的清理 / 最终提交 / 推送）
          DEADLINE=$(( $(date +%s) + 3*3600 - 600 ))

          # ================= 五阶段提示词 =================
          PROMPT_PERF='优化代码的性能和显存占用，但必须严格遵守 docs/design_notes.md 中标记【固定】的设计决策：注意力主路径必须保持 F.scaled_dot_product_attention 标准基线（它是本研究的对照设施不是研究变量）；不得改动 generalized_softsign 的数值稳定语义（_MIN_P=1e-3、_MIN_ALPHA=1e-4、对 max(|x|,1) 取倒数、copysign 符号处理）；不得删除或绕过任何手写 fused autograd kernel；QKSquash 必须保持 tanh 压缩。性能优化只能在固定设计的约束内进行（内存布局、分块、缓存、原地操作等）。每次改动后运行 python3 ci_gate.py 自检（含全量 pytest 对拍），不通过就自己修好。不要输出或写入"优化了哪些内容"的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug，如果有就修改代码。修复必须保持 docs/design_notes.md 中【固定】设计的实现方式与数值语义不变，不得借修复之名切换已固定的实现或做无意义的等价重写；不得削弱或删除 tests/ 中的对拍测试。每次修复后运行 python3 ci_gate.py 确认通过。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py、tests/、算力申请.md 同样绝对不能删除、修改或移动。'

          # ================= 科研方法改进阶段（sci）：提示词池，每次运行时随机选一个 =================
          # SCI_1 为通用提示词：只要求改进科研方法，不指定改进哪一方面；
          # SCI_2~SCI_6 各自只聚焦一个方面：实验设计与准备 / 数据处理 / 可复现性与工程规范 / 对比实验与消融 / 结果分析。
          PROMPT_SCI_1='改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_2='从实验设计与准备的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_3='从数据处理的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_4='从可复现性与工程规范的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_5='从对比实验与消融的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_6='从结果分析的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SINGLE='确保需要是单因素实验的实验都是单因素实验。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_APPLY='检查算力申请.md是否有错误，如果有就改好。不要删除或移动算力申请.md，也不要删除或移动 README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）、docs/design_notes.md、ci_gate.py 和 tests/。'
          PROMPT_CLEAN='不要删除、修改或移动算力申请.md——它是算力申请材料，其中的算力规模与预算估算属于申请所需信息，不属于“多余的内容”，也不属于“关于预算、花费的记录”。确保远程仓库里没有实验结果文件、REPORTxx.md 以及 autodl_budgetxx.json；确保 docs 目录只保留 design_notes.md；确保远程仓库中没有任何关于性能、预算、花费、修复了哪些bug和显存占用的记录（包括注释，但算力申请.md除外）。删除所有其他多余的内容。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；LICENSE 是开源许可证文件，同样必须原样保留，绝对不能删除、修改或移动，也不属于“多余的内容”；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样必须原样保留，绝对不能删除或移动，也不属于“多余的内容”；docs/design_notes.md 是固定的设计决策文档、ci_gate.py 是 CI 质量门禁脚本、tests/ 是对拍测试套件，三都必须原样保留，绝对不能删除、修改或移动。'

          # 每阶段单次调用的最大时长（秒）
          PERF_TIMEOUT=$((3*3600))     # 3h
          BUG_TIMEOUT=$((3*3600))      # 3h
          SCI_TIMEOUT=$((3*3600))      # 3h
          SINGLE_TIMEOUT=$((3600))     # 1h（单因素实验检查）
          CLEAN_TIMEOUT=$((3*3600))    # 3h
          APPLY_TIMEOUT=$((3*3600))    # 3h

          # ================= 动态模型池（不写死，实时读取线上目录） =================
          # 池直接来自 `opencode models opencode` 的实时输出：模型上新自动入池、
          # 下线自动出池，无需再改本文件。目录暂时不可达时池置空，
          # pick_model 会在需要时（run 开始探测 / 失效后重新探测）惰性重建重试。
          # 现在同时通过 --verbose 读取每个模型支持的 variant（思考强度档位）。
          declare -A MODEL_VARIANTS=()
          # ================= 优先模型：deepseek-v4.1-flash-free =================
          # 池中存在且未被判定失效时始终优先选用；不存在时保持随机选择。
          # 失效与否由 BROKEN_PROVIDERS 记录（见 detect_provider），run 内跨阶段生效。
          PREFERRED_MODEL="opencode/deepseek-v4.1-flash-free"

          # ================= 副选 provider：NVIDIA GLM（默认停用：NVIDIA_PROB=0） =================
          # 实测（2026-10-19/20 的 4 个 run，共 13 次 NVIDIA 阶段）：13/13 全部被阶段预算
          # 杀掉，一次都没在预算内返回；单个工具调用延迟约 121s，5 分钟只走 2~3 步。
          # 历史提交里 NVIDIA 只占 4%。因此默认关闭（NVIDIA_PROB=0），需要时再调大。
          # 免费模型池（优先 deepseek-v4.1-flash-free，池不可达时随机）是默认唯一路径。
          # NVIDIA 端点 https://integrate.api.nvidia.com/v1，模型优先 glm-5.3，目录中
          # 不存在时自动改用 glm-5-3-flash；只在 NVIDIA_PROB>0 时参与候选。
          # harness 固定为 DeepSeek Harness（dsh）：所有阶段一律通过 `dsh --profile headless ...` 调用。
          NVIDIA_PROB=0
          NVIDIA_MODEL=""
          CURRENT_PROVIDER="free"
          BROKEN_PROVIDERS=""
          # 本次 run 内选定的模型（探测只在 run 开始时做一次，见 detect_provider）
          SELECTED_MODEL=""
          SELECTED_PROVIDER=""

          mark_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) ;; *) BROKEN_PROVIDERS="$BROKEN_PROVIDERS${BROKEN_PROVIDERS:+,}$1" ;; esac
          }
          is_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          # ---------- NVIDIA GLM 探测：优先 glm-5.3，没有则 glm-5-3-flash ----------
          # 探测成功同时把 nvidia provider 配置写入 ~/.config/opencode/opencode.nvidia.json
          # （可选合并 $1 指定的基准配置，保留其中已有字段，如权限锁定）。
          cat > /tmp/probe_nvidia.py <<'PYEOF'
          import json, os, sys, urllib.request

          def emit(status, model=''):
              print((status + ' ' + model).strip())
              sys.exit(0)

          def norm(s):
              return s.lower().replace('.', '-').replace('_', '-')

          key = os.environ.get('NVIDIA_API_KEY', '').strip()
          if not key:
              emit('DOWN')
          try:
              req = urllib.request.Request(
                  'https://integrate.api.nvidia.com/v1/models',
                  headers={'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
          except Exception:
              emit('DOWN')

          ids = [m.get('id', '') for m in (d.get('data') or []) if m.get('id')]

          def pick(cands, target):
              if not cands:
                  return ''
              def keyf(x):
                  return (0 if norm(x.rsplit('/', 1)[-1]) == target else 1, len(x))
              return sorted(cands, key=keyf)[0]

          primary = [i for i in ids if 'glm-5-3' in norm(i) and 'flash' not in norm(i)]
          flash = [i for i in ids if 'glm-5-3' in norm(i) and 'flash' in norm(i)]
          mid = pick(primary, 'glm-5-3') or pick(flash, 'glm-5-3-flash')
          if not mid:
              emit('NOMODEL')

          cfg = {}
          base = sys.argv[1] if len(sys.argv) > 1 else ''
          if base and os.path.exists(base):
              try:
                  with open(base) as f:
                      cfg = json.load(f)
              except Exception:
                  cfg = {}
          cfg['$schema'] = 'https://opencode.ai/config.json'
          cfg.setdefault('provider', {})
          cfg['provider']['nvidia'] = {
              'npm': '@ai-sdk/openai-compatible',
              'name': 'NVIDIA',
              'options': {
                  'baseURL': 'https://integrate.api.nvidia.com/v1',
                  'apiKey': '{env:NVIDIA_API_KEY}',
              },
              'models': {mid: {'name': mid}},
          }
          cfg['model'] = 'nvidia/' + mid
          try:
              os.makedirs(os.path.expanduser('~/.config/opencode'), exist_ok=True)
              with open(os.path.expanduser('~/.config/opencode/opencode.nvidia.json'), 'w') as f:
                  json.dump(cfg, f, indent=2, ensure_ascii=False)
          except Exception:
              pass
          emit('OK', mid)
          PYEOF

          probe_nvidia() {
            local out st mid
            out="$(python3 /tmp/probe_nvidia.py "$HOME/.config/opencode/opencode.free.json" 2>/dev/null)" || out="DOWN"
            st="${out%% *}"; mid="${out#* }"
            if [ "$st" = "OK" ] && [ "$mid" != "$out" ] && [ -n "$mid" ]; then
              NVIDIA_MODEL="$mid"; return 0
            fi
            NVIDIA_MODEL=""; return 1
          }
          # ---- 解析脚本：从 --verbose 输出提取模型 ID + 支持的 variant 列表 ----
          # `opencode models --verbose` 在每个模型行后输出一段 JSON 元数据，其中
          # variants 字段列出该模型支持的思考强度档位（如 deepseek-v4.1-flash-free
          # 有 low/high/max）。输出两列（\t 分隔）：opencode/<model-id>  逗号分隔 variant。
          cat > /tmp/parse_model_variants.py <<'PYEOF'
          import sys, json, re
          text = sys.stdin.read()
          parts = re.split(r'(?m)^opencode/([A-Za-z0-9][A-Za-z0-9._-]*)[ \t]*$', text)
          for i in range(1, len(parts) - 1, 2):
              mid, blob = parts[i], parts[i + 1]
              try:
                  meta = json.loads(blob)
              except Exception:
                  try:
                      meta = json.loads(blob[:blob.rindex('}') + 1])
                  except Exception:
                      continue
              variants = sorted((meta.get('variants') or {}).keys())
              print('opencode/%s\t%s' % (mid, ','.join(variants)))
          PYEOF
          build_model_pool() {
            local out tsv m v
            local pool=()
            # --refresh 强制拉取线上最新目录（避免 runner 本地缓存过期、错过新上的模型）；
            # refresh 失败时自动回退缓存目录，仍失败则返回空，由 pick_model 惰性重建重试。
            out="$(opencode models opencode --verbose --refresh 2>/dev/null \
              || opencode models opencode --verbose 2>/dev/null \
              || opencode models --verbose 2>/dev/null \
              || true)"
            [ -z "$out" ] && return 1
            tsv="$(printf '%s\n' "$out" | python3 /tmp/parse_model_variants.py 2>/dev/null)" || true
            [ -z "$tsv" ] && return 1
            MODEL_VARIANTS=()
            while IFS=$'\t' read -r m v; do
              [ -n "$m" ] || continue
              pool+=("$m")
              MODEL_VARIANTS["$m"]="$v"
            done <<< "$tsv"
            [ ${#pool[@]} -eq 0 ] && return 1
            FREE_MODELS=("${pool[@]}")
            echo "[info] 动态模型池（${#FREE_MODELS[@]} 个）: ${FREE_MODELS[*]}"
            if printf '%s\n' "${FREE_MODELS[@]}" | grep -qx -- "$PREFERRED_MODEL"; then
              echo "[info] 优先模型在池中: $PREFERRED_MODEL (variant: ${MODEL_VARIANTS[$PREFERRED_MODEL]:-无})"
            else
              echo "[warn] 优先模型 $PREFERRED_MODEL 不在池中，本阶段改用随机模型"
            fi
            return 0
          }
          if ! build_model_pool; then
            echo "[warn] 启动时读取模型目录失败，模型池暂空；将随阶段重试自动重建"
            FREE_MODELS=()
            MODEL_VARIANTS=()
          fi

          # ================= workflow 防删自愈 =================
          # opencode 的 clean 阶段可能把 .github 当作“多余内容”删除。
          # 启动时保存触发版本的 workflow 原始副本（触发 commit 必然包含它），
          # 每次提交前校验，一旦被删/被改立即恢复，保证循环链条永不断。
          WF_PATH=".github/workflows/continuous-loop.yml"
          PRISTINE=/tmp/wf_pristine.yml

          fetch_pristine() {
            # 优先：raw 直读触发 commit 的 workflow 文件（公共仓库免鉴权）
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${WF_PATH}" -o "$PRISTINE" 2>/dev/null && [ -s "$PRISTINE" ]; then
              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$WF_PATH" ]; then
              cp "$WF_PATH" "$PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_workflow() {
            [ -s "$PRISTINE" ] || return 0
            if [ ! -f "$WF_PATH" ] || ! cmp -s "$WF_PATH" "$PRISTINE"; then
              mkdir -p "$(dirname "$WF_PATH")"
              cp "$PRISTINE" "$WF_PATH"
              echo "[guard] 检测到 workflow 文件被删除/篡改，已自动恢复"
            fi
          }

          if fetch_pristine && grep -q "Continuous Loop" "$PRISTINE"; then
            echo "[guard] workflow 原始副本就绪（$(wc -l < "$PRISTINE") 行）"
          else
            echo "[warn] 无法获取 workflow 原始副本，自愈保护不可用"
          fi
          ensure_workflow

          # ================= LICENSE 防删自愈 =================
          # opencode 的 clean 阶段可能把 LICENSE 当作“多余内容”删除或篡改。
          # 启动时保存触发 commit 的 LICENSE 原始副本，
          # 每次提交前校验，一旦被删/被改立即恢复，保证 LICENSE 永不丢失。
          LICENSE_PATH="LICENSE"
          LICENSE_PRISTINE=/tmp/license_pristine

          fetch_license_pristine() {
            # 优先：raw 直读触发 commit 的 LICENSE（公共仓库免鉴权）
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/LICENSE" -o "$LICENSE_PRISTINE" 2>/dev/null && [ -s "$LICENSE_PRISTINE" ]; then
              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$LICENSE_PATH" ]; then
              cp "$LICENSE_PATH" "$LICENSE_PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_license() {
            [ -s "$LICENSE_PRISTINE" ] || return 0
            if [ ! -f "$LICENSE_PATH" ] || ! cmp -s "$LICENSE_PATH" "$LICENSE_PRISTINE"; then
              cp "$LICENSE_PRISTINE" "$LICENSE_PATH"
              echo "[guard] 检测到 LICENSE 被删除/篡改，已自动恢复"
            fi
          }

          if fetch_license_pristine; then
            echo "[guard] LICENSE 原始副本就绪（$(wc -c < "$LICENSE_PRISTINE") 字节）"
          else
            echo "[warn] 无法获取 LICENSE 原始副本，LICENSE 自愈保护不可用"
          fi
          ensure_license

          # ================= 算力申请.md 防删自愈 =================
          # clean 阶段可能把 算力申请.md 当作“多余内容”删除。
          # 启动时保存工作区副本；每次提交前校验，一旦被删立即从 HEAD（其次启动副本）恢复，
          # 保证文件不丢失（允许 apply 阶段的正常修改）。
          APPLY_PATH="算力申请.md"
          APPLY_PRISTINE=/tmp/apply_pristine.md

          if [ -f "$APPLY_PATH" ]; then
            cp "$APPLY_PATH" "$APPLY_PRISTINE"
            echo "[guard] 算力申请.md 启动副本就绪（$(wc -l < "$APPLY_PRISTINE") 行）"
          else
            echo "[warn] 工作区未找到 算力申请.md，防删自愈不可用"
          fi

          ensure_apply() {
            [ -f "$APPLY_PATH" ] && return 0
            if git show "HEAD:${APPLY_PATH}" > /tmp/apply_restore.md 2>/dev/null && [ -s /tmp/apply_restore.md ]; then
              mv /tmp/apply_restore.md "$APPLY_PATH"
              echo "[guard] 检测到 算力申请.md 被删除，已从 HEAD 恢复"
            elif [ -s "$APPLY_PRISTINE" ]; then
              cp "$APPLY_PRISTINE" "$APPLY_PATH"
              echo "[guard] 检测到 算力申请.md 被删除，已从启动副本恢复"
            fi
          }


          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_readme

          # ================= 质量门禁与固定文件防篡改 =================
          # ci_gate.py：语法 + 设计固定项 + 全量 pytest 对拍；不通过则整段撤销。
          # design_notes.md / ci_gate.py 以 design-pin 标签为基准恢复
          # （AI 无 push 权限，动不了标签）。
          GATE_PATH="ci_gate.py"

          fetch_pinned() {
            # $1 = repo path, $2 = dest
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/design-pin/$1" -o "$2" 2>/dev/null && [ -s "$2" ]; then
              return 0
            fi
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$1" -o "$2" 2>/dev/null && [ -s "$2" ]
          }

          ensure_design_notes() {
            if fetch_pinned "docs/design_notes.md" /tmp/dn_pinned.md 2>/dev/null; then
              if [ ! -f docs/design_notes.md ] || ! cmp -s docs/design_notes.md /tmp/dn_pinned.md; then
                mkdir -p docs
                cp /tmp/dn_pinned.md docs/design_notes.md
                echo "[guard] 检测到 design_notes.md 被删除/篡改，已从 design-pin 恢复"
              fi
            elif [ ! -f docs/design_notes.md ]; then
              echo "[warn] design_notes.md 缺失且无法获取固定版本"
            fi
          }

          ensure_gate() {
            if fetch_pinned "ci_gate.py" /tmp/gate_pinned.py 2>/dev/null; then
              if [ ! -f "$GATE_PATH" ] || ! cmp -s "$GATE_PATH" /tmp/gate_pinned.py; then
                cp /tmp/gate_pinned.py "$GATE_PATH"
                echo "[guard] 检测到 ci_gate.py 被删除/篡改，已从 design-pin 恢复"
              fi
            elif [ ! -f "$GATE_PATH" ]; then
              echo "[warn] ci_gate.py 缺失且无法获取固定版本"
            fi
          }

          gate_check() {
            ensure_gate
            echo "=========== GATE CHECK (syntax + design pins + pytest) ==========="
            python3 "$GATE_PATH"
            local EC=$?
            if [ $EC -eq 0 ]; then
              echo "[gate] PASS"
            else
              echo "[gate] FAIL (exit=$EC) —— 本阶段改动将被撤销"
            fi
            return $EC
          }

          reject_phase() {
            # 阶段内允许 agent 自己 git commit（防超时丢进度），
            # 因此回滚要回到「本阶段开始时的 HEAD」，不能只回到当前 HEAD。
            local base="${PHASE_BASE:-HEAD}"
            echo "[gate] git reset --hard ${base} + git clean -fd —— 撤销本阶段全部改动"
            git reset --hard "$base"
            git clean -fd
            ensure_design_notes
            ensure_gate
          }

          i=0
          FAIL_COUNT=0
          RATE_COUNT=0
          CURRENT_MODEL=""
          PREVIOUS_MODEL=""

          commit_and_push() {
            ensure_workflow
            ensure_license
            ensure_apply
            ensure_readme
            ensure_design_notes
            ensure_gate
            rm -f .opencode_issues.md
            git add -A || true
            git commit -m "auto: iteration $1" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            ensure_workflow
            ensure_license
            ensure_apply
            ensure_readme
            ensure_design_notes
            ensure_gate
            # 语法快速检查：半成品代码不允许进入历史
            if [ -f "$GATE_PATH" ] && ! python3 "$GATE_PATH" --syntax-only; then
              echo "[trap] 语法检查未通过，丢弃未提交改动"
              git reset --hard HEAD
              git clean -fd
              exit 0
            fi
            rm -f .opencode_issues.md
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 选模型：优先 deepseek-v4.1-flash-free，没有则随机 ----------
          # 1) 优先模型在池中、且未被判定失效时，始终优先选用；
          # 2) 否则在未失效的模型里随机选择，并尽量避免和上次相同。
          # 池为空时先惰性重建（目录 API 瞬时故障的自愈）；
          # 重建后（或池内模型全部失效）返回 1，由 detect_provider 换下一轮候选。
          pick_model() {
            if [ ${#FREE_MODELS[@]} -eq 0 ]; then
              build_model_pool || true
            fi
            # 只从「未被判定失效」的模型里挑：失效标记由 detect_provider 维护，
            # 一个 run 内不再重复尝试同一个坏模型（第二轮会清空标记重试）。
            local healthy=() x
            for x in "${FREE_MODELS[@]}"; do
              is_broken "$x" || healthy+=("$x")
            done
            local n=${#healthy[@]}
            if [ "$n" -eq 0 ]; then
              CURRENT_MODEL=""
              return 1
            fi
            local m=""
            if [ -n "$PREFERRED_MODEL" ]; then
              for x in "${healthy[@]}"; do
                if [ "$x" = "$PREFERRED_MODEL" ]; then m="$x"; break; fi
              done
            fi
            if [ -z "$m" ]; then
              for _ in 1 2 3; do
                m="${healthy[$((RANDOM % n))]}"
                if [ "$n" -le 1 ] || [ "$m" != "$PREVIOUS_MODEL" ]; then break; fi
              done
            fi
            PREVIOUS_MODEL="$m"
            CURRENT_MODEL="$m"
            return 0
          }

          # ---------- 选 provider：默认只有免费模型池（NVIDIA_PROB=0）----------
          # NVIDIA 路径（仅 NVIDIA_PROB>0 时启用）：切换到「权限锁定 + nvidia provider」
          # 配置，模型 glm-5.3(-flash)；免费路径：恢复权限锁定基准配置，
          # 再按原逻辑选模型（优先 deepseek-v4.1-flash-free）。
          pick_provider() {
            CURRENT_PROVIDER="free"
            local roll=$((RANDOM % 100))
            if [ "$roll" -lt "$NVIDIA_PROB" ]; then
              if ! is_broken nvidia && probe_nvidia; then
                cp -f "$HOME/.config/opencode/opencode.nvidia.json" "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="nvidia"
                CURRENT_MODEL="nvidia/$NVIDIA_MODEL"
                PREVIOUS_MODEL="$CURRENT_MODEL"
                echo "[info] 抽中 NVIDIA GLM（${NVIDIA_PROB}%）：$NVIDIA_MODEL"
                return 0
              fi
              echo "[info] 抽中 NVIDIA 但不可用（无 key / 端点失效 / 无 glm-5.3(-flash)），回退免费模型"
            fi
            cp -f "$HOME/.config/opencode/opencode.free.json" "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
            if ! pick_model; then
              # 免费池不可用（池空或池内模型全部失效）：仅在 NVIDIA 启用时尝试救场
              if [ "$NVIDIA_PROB" -gt 0 ] && ! is_broken nvidia && probe_nvidia; then
                cp -f "$HOME/.config/opencode/opencode.nvidia.json" "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="nvidia"
                CURRENT_MODEL="nvidia/$NVIDIA_MODEL"
                PREVIOUS_MODEL="$CURRENT_MODEL"
                echo "[info] 免费模型池不可用，改用 NVIDIA：$NVIDIA_MODEL"
                return 0
              fi
              return 1
            fi
            return 0
          }


          # ---------- 确定模型思考强度：优先 max，无 max 用 high，都不支持则不设置 ----------
          # 从模型官方元数据公布的 variant 列表中选取；都不支持时按默认方式启动
          # （不传 --variant），避免传无效值导致启动失败。
          variant_for() {
            local v="${MODEL_VARIANTS[$1]:-}"
            case ",$v," in
              *,max,*)  echo "max" ;;
              *,high,*) echo "high" ;;
              *)        echo "" ;;
            esac
          }

          # ---------- 一次性模型探测（每个 run 只做一次） ----------
          # run 开始时探测一次，选定 SELECTED_MODEL；之后所有阶段直接
          #   dsh --profile headless "$prompt"
          # 只有收到 429 / 5xx / 连接失败 / 非零退出时，才清空选择并重新探测
          # （已判定失效的候选记在 BROKEN_PROVIDERS 里，不会重复尝试）。
          # 注意：只看模型目录不够——必须真跑一次冒烟调用，否则会选中「连得上但永远
          # 跑不完」的端点（实测 glm-5.3 单步 121s，13/13 个阶段全部被预算杀掉）。
          smoke_test() {
            local m="$1"
            local SEFFORT="" VARFLAG=()
            SEFFORT="$(variant_for "$m")"
            [ -n "$SEFFORT" ] && VARFLAG=(--variant "$SEFFORT")
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 dsh --profile headless "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }

          detect_provider() {
            local pass try cand model
            for pass in 1 2; do
              for try in 1 2 3 4 5 6; do
                if ! pick_provider; then
                  echo "[warn] 暂无可用模型（pass=$pass try=$try）"
                  break
                fi
                cand="$CURRENT_PROVIDER"
                model="$CURRENT_MODEL"
                if smoke_test "$model"; then
                  SELECTED_MODEL="$model"
                  SELECTED_PROVIDER="$cand"
                  export SELECTED_MODEL
                  echo "[provider] 选定 $model（$cand），本次 run 内固定使用，不再逐阶段探测"
                  return 0
                fi
                echo "[warn] $model 冒烟测试失败/超时，标记失效并换下一个候选"
                # NVIDIA 记 provider 名；免费池按具体模型 id 记录，避免一个坏模型拖垮整个池
                if [ "$cand" = "nvidia" ]; then mark_broken nvidia; else mark_broken "$model"; fi
              done
              # 第一轮全部失效：清空失效标记再试一轮（可能是瞬时故障）
              [ "$pass" -eq 1 ] && BROKEN_PROVIDERS=""
            done
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            return 1
          }

          # run 开始时探测一次；失败也不阻塞，run_phase 需要时会再试
          # ================= harness: DeepSeek Harness (dsh) + DeepSeek 官方 API =================
          # 固定 provider=deepseek-official、model=deepseek-flash；API key 从启动环境
          # DEEPSEEK_API_KEY 读取（headless profile 不读 GUI 凭据库）。
          # 本段覆盖下方（或上方）原有的 provider 探测实现：不再探测 NVIDIA / opencode Zen。
          SELECTED_MODEL="deepseek-official/deepseek-flash"
          SELECTED_PROVIDER="deepseek-official"
          CURRENT_MODEL="$SELECTED_MODEL"
          CURRENT_PROVIDER="$SELECTED_PROVIDER"
          pick_model() {
            CURRENT_MODEL="deepseek-official/deepseek-flash"
            CURRENT_PROVIDER="deepseek-official"
            return 0
          }
          pick_provider() {
            CURRENT_MODEL="deepseek-official/deepseek-flash"
            CURRENT_PROVIDER="deepseek-official"
            return 0
          }
          smoke_test() {
            timeout --kill-after=30 180 dsh --profile headless "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }
          detect_provider() {
            SELECTED_MODEL="deepseek-official/deepseek-flash"
            SELECTED_PROVIDER="deepseek-official"
            CURRENT_MODEL="$SELECTED_MODEL"
            CURRENT_PROVIDER="$SELECTED_PROVIDER"
            export SELECTED_MODEL SELECTED_PROVIDER
            echo "[provider] 固定使用 $SELECTED_MODEL（DeepSeek 官方 API）"
            if smoke_test; then
              return 0
            fi
            echo "[warn] dsh 冒烟测试失败（API key / 网络 / 配额）"
            return 1
          }
          if detect_provider; then :; else echo "[warn] 启动时未选出可用模型，第一个阶段会再探测一次"; fi

          # ---------- 单阶段执行（每阶段固定使用 SELECTED_MODEL，重试不叠加预算） ----------
          # 每个 run 只在 detect_provider 里探测一次；阶段内直接用 SELECTED_MODEL 调用。
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀 / 1 放弃
          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            local attempt=0
            # 整个阶段（含所有重试）共用的硬上限：重试不得让总时长超过 budget
            local phase_end=$(( $(date +%s) + budget ))
            FAIL_COUNT=0
            RATE_COUNT=0

            while :; do
              attempt=$((attempt+1))

              local NOW=$(date +%s)
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "[info] phase=$phase 全局时间已用尽，跳过"
                return 1
              fi
              local REMAIN=$(( DEADLINE - NOW ))
              # 每次尝试都重新计算本阶段剩余预算（原写法只改写 budget 不递减，
              # 失败重试可以跑出 2 倍预算）
              local budget_now=$(( phase_end - NOW ))
              [ "$budget_now" -gt "$REMAIN" ] && budget_now="$REMAIN"
              if [ "$budget_now" -le 60 ]; then
                echo "[info] phase=$phase 剩余时间不足，跳过"
                return 1
              fi

              # 正常路径：run 开始时已选定模型，这里不会发起任何网络探测
              if [ -z "$SELECTED_MODEL" ]; then
                if ! detect_provider; then
                  FAIL_COUNT=$((FAIL_COUNT+1))
                  echo "[warn] phase=$phase 暂无可用模型（免费池与 NVIDIA 均不可用），连续 $FAIL_COUNT 次，120s 后重试 (attempt=$attempt)"
                  if [ $FAIL_COUNT -ge 3 ]; then
                    echo "[warn] 连续 3 次拿不到可用模型，放弃该阶段"
                    return 1
                  fi
                  sleep 120
                  continue
                fi
              fi

              # 思考强度：按所选模型公布的 variant 档位（优先 max，无 max 用 high）
              local EFFORT="" VARFLAG=()
              EFFORT="$(variant_for "$SELECTED_MODEL")"
              if [ -n "$EFFORT" ]; then
                VARFLAG=(--variant "$EFFORT")
                echo "[info] model=$SELECTED_MODEL 思考强度=$EFFORT"
              else
                echo "[info] model=$SELECTED_MODEL 按默认档位启动"
              fi
              echo "=========== iter #$i | phase=$phase | attempt=$attempt | provider=$SELECTED_PROVIDER | model=$SELECTED_MODEL effort=${EFFORT:-none} ==========="

              timeout --kill-after=180 "$budget_now" dsh --profile headless "$prompt" 2>&1 | tee "$OUT"
              local EC=$?

              # 成功
              if [ $EC -eq 0 ]; then
                return 0
              fi

              # 超时 / 被杀：阶段预算耗尽属正常结束，改动照常提交
              if [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
                echo "[warn] phase=$phase 超时/被杀 (exit=$EC)"
                return $EC
              fi

              # 鉴权类错误提示（免费模型匿名限额耗尽/需要 key 时的排查线索）
              if tail -40 "$OUT" | grep -qiE "401|unauthorized|invalid.{0,4}api.?key|missing.{0,4}api.?key"; then
                echo "[hint] 疑似鉴权问题：匿名限额可能耗尽。可在仓库 secrets 配置 OPENCODE_API_KEY 提升限额后重试"
              fi

              # 429 限流 / 5xx / 连接失败：丢弃当前模型，下一轮重新探测（且跳过它）
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429|FreeTierError|free tier|status.{0,3}5[0-9][0-9]|econnreset|etimedout|fetch failed|socket hang up|connection (refused|reset)"; then
                RATE_COUNT=$((RATE_COUNT+1))
                echo "[warn] phase=$phase 限流/5xx/连接失败（$SELECTED_MODEL），重新探测 provider (attempt=$attempt, 连续: $RATE_COUNT)"
                mark_broken "$SELECTED_MODEL"
                SELECTED_MODEL=""
                if [ $RATE_COUNT -ge 8 ]; then
                  echo "[warn] 连续 8 次限流/网络失败，放弃该阶段"
                  return 1
                fi
                sleep 90
                continue
              fi

              # 其它非零退出：同样丢弃当前模型并重新探测，直到阶段预算或全局时间用尽
              FAIL_COUNT=$((FAIL_COUNT+1))
              echo "[warn] phase=$phase 调用失败 (exit=$EC, model=$SELECTED_MODEL)，重新探测 provider (attempt=$attempt, 连续: $FAIL_COUNT)"
              mark_broken "$SELECTED_MODEL"
              SELECTED_MODEL=""
              if [ $FAIL_COUNT -ge 3 ]; then
                echo "[warn] 连续 3 次失败，放弃该阶段"
                return 1
              fi
              sleep 30
            done

            return 1
          }

          # ================= 单次调用内“先定位、再修复” =================
          # 不再单独占用 detect 预算：把“快速定位问题”并入同一次 opencode 调用，
          # 让修复拿满整个阶段预算，减少一次模型调用的固定开销。
          # 目标是在预算内尽可能多完成高价值改动，而不是只做一两个小改动。
          ISSUES_FILE=".opencode_issues.md"
          fast_prompt() {
            case "$1" in
              perf) printf '先用不超过 5-8 分钟快速扫描性能热点（可写入 `%s`，该临时清单不是报告），然后持续优化；在本阶段预算内尽可能多完成高价值、可验证的优化，不要只做 1-2 个就停，也不要为了赶时间提前结束。每个改动后运行自检；修复完成后删除该临时清单。每完成一个可验证的改动就立即 git commit（不要 push、不要 amend），避免阶段被超时中断时丢失进度。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
              bug)  printf '先快速定位 bug（可把要点写入 `%s`，该临时清单不是报告），然后持续修复；在本阶段预算内尽可能多修复高价值、可验证的 bug，不要只修一个就停，也不要为了赶时间提前结束。每个修复后运行自检；修完删除该临时清单。每完成一个可验证的修复就立即 git commit（不要 push、不要 amend），避免阶段被超时中断时丢失进度。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
              sci)  printf '先用不超过 5-8 分钟选出高价值实验方法问题（可写入 `%s`，该临时清单不是报告），然后持续改进；在本阶段预算内尽可能多完成实质性改进，不要只做 1-2 个就停，也不要为了赶时间提前结束。每个改动后运行自检；修复完成后删除该临时清单。每完成一个可验证的改动就立即 git commit（不要 push、不要 amend），避免阶段被超时中断时丢失进度。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
            esac
          }

          # ================= 测试门（取消抽样：每个写代码阶段提交后都执行）=================
          # 在「写代码阶段（bug / sci）提交之后」触发（调用点见主循环的 phase 守卫）。
          # 不再掷骰子抽样：每次都跑一遍本仓库的 ci_gate.py
          # （语法 + 设计固定项 + 全量 pytest 对拍）；
          # 跑不通 → 调用 dsh 修复 → 修复结果按本仓库既有提交路径落到 master。
          maybe_run_tests() {
            local iter="$1"
            # 取消原先 20% 抽样：实测门禁耗时可控，而原先 80% 的提交从未被测试门验证过。
            echo "[test-gate] iter #$iter 执行全量测试"
            local TG_REMAIN=$(( DEADLINE - $(date +%s) ))
            if [ "$TG_REMAIN" -lt 1200 ]; then
              echo "[test-gate] 剩余时间不足 20 分钟，放弃本次测试"
              return 0
            fi
            cat > /tmp/tg_run.sh <<'TGEOF'
            set +e
            [ -f ci_gate.py ] || exit 42
            python3 ci_gate.py
            exit $?
          TGEOF
            local TG_LOG=/tmp/test_gate.log
            echo "=========== TEST GATE (iter #$iter) ==========="
            timeout --kill-after=60 1500 bash /tmp/tg_run.sh > "$TG_LOG" 2>&1
            local TG_EC=$?
            tail -25 "$TG_LOG" 2>/dev/null || true
            if [ "$TG_EC" -eq 0 ]; then
              echo "[test-gate] 测试通过，无需修复"
              return 0
            fi
            if [ "$TG_EC" -eq 42 ]; then
              echo "[test-gate] 本仓库没有可识别的测试，跳过"
              return 0
            fi
            if [ "$TG_EC" -eq 43 ]; then
              echo "[test-gate] 测试依赖环境不可用（安装失败），跳过修复"
              return 0
            fi
            if [ "$TG_EC" -eq 124 ] || [ "$TG_EC" -eq 137 ] || [ "$TG_EC" -eq 143 ]; then
              echo "[test-gate] 测试超时/被中断 (exit=$TG_EC)，结果不确定，本轮不修复"
              return 0
            fi
            echo "[test-gate] 测试未通过 (exit=$TG_EC)，调用 dsh 修复"
            local TG_FIX_BUDGET=$(( DEADLINE - $(date +%s) - 900 ))
            if [ "$TG_FIX_BUDGET" -lt 900 ]; then
              echo "[test-gate] 剩余时间不足以安排修复，仅记录失败"
              return 0
            fi
            if [ "$TG_FIX_BUDGET" -gt 10800 ]; then TG_FIX_BUDGET=10800; fi
            {
              echo '本仓库的测试跑不通，请修复。复现方式：在仓库根目录运行 bash /tmp/tg_run.sh。'
              echo
              echo '失败日志（最后 80 行）：'
              tail -80 "$TG_LOG" 2>/dev/null
              echo
              echo '要求：'
              echo '1. 只修复导致测试失败的问题，不得削弱、跳过或删除测试，不得修改门禁脚本让断言失效；'
              echo '2. 不要借修复之名重写无关代码，保持原有功能语义不变；'
              echo '3. .github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；'
              echo '4. 修复后必须自行运行测试并确认完全通过。'
            } > /tmp/tg_fix_prompt.txt
            PHASE_BASE="$(git rev-parse HEAD)"
            run_phase "testfix" "$(cat /tmp/tg_fix_prompt.txt)" "$TG_FIX_BUDGET" || true


            # 修复结果走与各阶段一致的质量门禁 + 提交路径（main/master）
            ensure_design_notes
            if gate_check; then
              commit_and_push "$iter-testfix"
            else
              reject_phase
            fi

            return 0
          }

          # ================= 主循环 =================
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            # ----- 阶段：perf 与 clean 已停用 → bug -> sci -> single -> apply（clean 的清理工作交给收尾的 shell 步骤）-----
            # for phase in perf bug sci single clean apply; do
            for phase in bug sci single apply; do
              case "$phase" in
                perf)  P="$PROMPT_PERF";  T="$PERF_TIMEOUT"  ;;
                bug)   P="$PROMPT_BUG";   T="$BUG_TIMEOUT"   ;;
                sci)
                  # 科研方法改进：从 PROMPT_SCI_1~6 中随机选一个提示词
                  SCI_ROLL=$(( (RANDOM % 6) + 1 ))
                  case "$SCI_ROLL" in
                    1) P="$PROMPT_SCI_1"; SCI_LABEL='通用（不指定方面）' ;;
                    2) P="$PROMPT_SCI_2"; SCI_LABEL='实验设计与准备' ;;
                    3) P="$PROMPT_SCI_3"; SCI_LABEL='数据处理' ;;
                    4) P="$PROMPT_SCI_4"; SCI_LABEL='可复现性与工程规范' ;;
                    5) P="$PROMPT_SCI_5"; SCI_LABEL='对比实验与消融' ;;
                    6) P="$PROMPT_SCI_6"; SCI_LABEL='结果分析' ;;
                  esac
                  T="$SCI_TIMEOUT"
                  echo "[info] sci 阶段随机选中科研方法提示词 #$SCI_ROLL：$SCI_LABEL"
                ;;
                clean) P="$PROMPT_CLEAN"; T="$CLEAN_TIMEOUT" ;;
                single) P="$PROMPT_SINGLE"; T="$SINGLE_TIMEOUT" ;;
                apply) P="$PROMPT_APPLY"; T="$APPLY_TIMEOUT" ;;
              esac

              # 收窄到剩余时间
              REMAIN=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAIN" -le 0 ]; then
                echo "[info] 全局时间已到，退出循环"
                break 2
              fi
              if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

              echo ">>> iteration #$i | phase=$phase | budget=${T}s"
              case "$phase" in
                perf|bug|sci) P="$(fast_prompt "$phase" "$P")" ;;
              esac
              PHASE_BASE="$(git rev-parse HEAD)"
              run_phase "$phase" "$P" "$T"

              # ---- 质量门禁：通过才提交；不通过则整段撤销 ----
              ensure_design_notes
              if gate_check; then
                commit_and_push "$i-$phase"
              else
                reject_phase
              fi

              # ⭐ 测试门：bug / sci / single 阶段提交后都跑一遍全量测试，详见 maybe_run_tests
              case "$phase" in
                bug|sci|single) maybe_run_tests "$i" ;;
              esac

              sleep 5
            done
          done

      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          rm -f .opencode_issues.md
          find . -type f -name 'REPORT*.md'          -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name 'design_notes.md' -exec rm -rf {} +
            [ -f docs/design_notes.md ] || : > docs/design_notes.md
          fi

      - name: Final commit and push
        if: always()
        run: |
          set +e
          # 防删自愈：收尾提交前恢复被删/改的 workflow
          WF=".github/workflows/continuous-loop.yml"
          PRISTINE=/tmp/wf_pristine.yml
          if [ ! -s "$PRISTINE" ] && [ -n "${GITHUB_SHA:-}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${WF}" -o "$PRISTINE" 2>/dev/null || true
          fi
          if [ -s "$PRISTINE" ] && { [ ! -f "$WF" ] || ! cmp -s "$WF" "$PRISTINE"; }; then
            mkdir -p .github/workflows
            cp "$PRISTINE" "$WF"
            echo "[guard] 收尾阶段发现 workflow 被删/改，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删/改的 LICENSE
          LIC="LICENSE"
          LIC_PRISTINE=/tmp/license_pristine
          if [ ! -s "$LIC_PRISTINE" ] && [ -n "${GITHUB_SHA:-}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/LICENSE" -o "$LIC_PRISTINE" 2>/dev/null || true
          fi
          if [ -s "$LIC_PRISTINE" ] && { [ ! -f "$LIC" ] || ! cmp -s "$LIC" "$LIC_PRISTINE"; }; then
            cp "$LIC_PRISTINE" "$LIC"
            echo "[guard] 收尾阶段发现 LICENSE 被删/改，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 算力申请.md
          if [ ! -f "算力申请.md" ]; then
            if git show "HEAD:算力申请.md" > /tmp/apply_restore.md 2>/dev/null && [ -s /tmp/apply_restore.md ]; then
              mv /tmp/apply_restore.md "算力申请.md"
            elif [ -s /tmp/apply_pristine.md ]; then
              cp /tmp/apply_pristine.md "算力申请.md"
            fi
            [ -f "算力申请.md" ] && echo "[guard] 收尾阶段发现 算力申请.md 被删，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 README.md
          if [ ! -f "README.md" ]; then
            if git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          # 防删自愈：design_notes.md / ci_gate.py（design-pin 基准，标签不存在时退回触发提交）
          fetch_pinned_final() {
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/design-pin/$1" -o "$2" 2>/dev/null && [ -s "$2" ]; then
              return 0
            fi
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$1" -o "$2" 2>/dev/null && [ -s "$2" ]
          }
          if fetch_pinned_final "docs/design_notes.md" /tmp/dn_final.md; then
            if [ ! -f docs/design_notes.md ] || ! cmp -s docs/design_notes.md /tmp/dn_final.md; then
              mkdir -p docs && cp /tmp/dn_final.md docs/design_notes.md
              echo "[guard] 收尾阶段发现 design_notes.md 被删/改，已恢复"
            fi
          fi
          if fetch_pinned_final "ci_gate.py" /tmp/gate_final.py; then
            if [ ! -f ci_gate.py ] || ! cmp -s ci_gate.py /tmp/gate_final.py; then
              cp /tmp/gate_final.py ci_gate.py
              echo "[guard] 收尾阶段发现 ci_gate.py 被删/改，已恢复"
            fi
          fi
          # 质量门禁：收尾状态必须可运行，否则回退到最后一次已验证状态
          if [ -f ci_gate.py ] && ! python3 ci_gate.py; then
            echo "[gate] 收尾状态未通过，回退到 HEAD"
            git reset --hard HEAD
            git clean -fd
          fi
          git add -A
          git commit -m "auto: end of 5h run, cleanup" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-master}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-master}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"
  # ===== loop hand-off (added) =====

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会紧接着启动（已实测验证）。
  # 这里无条件派发一个新的后继 run：它在组内排队，本 run 退出的一瞬间就被调度。
  # 万一这个 job 连启动都没机会（整个 run 被强杀），*/15 心跳会兜底。
  next-run:
    needs: [run-opencode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */15 心跳会补位"
          exit 0
