[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adasquash"
version = "0.1.0"
description = "Statistic-free adaptive normalization layers for deep and low-precision Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhong Wenjia" }]
keywords = ["deep-learning", "normalization", "transformers", "reproducibility"]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0,<10.0"]
eval = ["lm-eval>=0.4,<1.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["adasquash*", "scripts*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
xfail_strict = true

[tool.coverage.run]
source = ["adasquash", "scripts"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
