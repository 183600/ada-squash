# Phase 1 controlled companion to configs/gpt2-124m-dytcd.yaml: the identical
# recipe and the identical per-channel x depth alpha, LayerScale residual,
# gamma/beta - only the generalized softsign is swapped for tanh
# (`norm: dytcd_tanh`, the plain-autograd comparator the ablation matrix uses
# for its activation-family leave-one-out). dytcd-vs-dytcd-tanh therefore
# attributes a delta to the saturation family alone instead of bundling it
# with the per-channel axis as dytd-vs-dytcd does.
model: gpt2-124m
norm: dytcd_tanh
alpha_0: 0.9
k_init: 1.0
learnable_k: true
qk_norm: null
use_layerscale: true
layerscale_init: 1.0e-5

hypothesis: The DyT-CD gain survives with tanh instead of generalized softsign, so it is not explained by the activation family alone.

seeds: [42, 43, 44]

dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: gpt2
seq_len: 1024
batch_size: 32
grad_accum: 4

max_steps: 10000
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

# Held-out validation: the same disjoint wikitext test slice as the other
# Phase 1 configs, so every controlled contrast selects on the same stream.
val_every: 500
val_batches: 16
val_dataset: Salesforce/wikitext
val_dataset_config: wikitext-103-raw-v1
val_split: test

output_dir: runs/gpt2-124m-dytcd-tanh
log_every: 20
stats_every: 500
save_every: 2000
