

model: gpt2-124m





batch_size: 8
seq_len: 512
max_steps: 1000
lr: 6.0e-4
weight_decay: 0.1
seed: 42

log_every: 50
stats_every: 200
output_dir: runs/ablation




ablations:

  - name: dyt_no_perchannel
    norm: dyt
  - name: dytc_perchannel
    norm: dytc
    p_init: 2.0
    learnable_p: false
    alpha_jitter: 0.0
  - name: dytcd_full
    norm: dytcd





  - name: dytd_k0_no_depth_schedule
    norm: dytd
    k_init: 0.0
    learnable_k: false
  - name: dytd_full
    norm: dytd














  - name: dytcd_no_ls
    norm: dytcd
    use_layerscale: false
  - name: dytcd_ls1e5
    norm: dytcd
    layerscale_init: 1.0e-5
  - name: dytcd_ls1e3
    norm: dytcd
    layerscale_init: 1.0e-3


  - name: dytc_p1_softsign
    norm: dytc
    p_init: 1.0
    learnable_p: false
    alpha_jitter: 0.0
  - name: dytc_p2_softsign
    norm: dytc
    p_init: 2.0
    learnable_p: false
    alpha_jitter: 0.0
  - name: dytc_p4_softsign
    norm: dytc
    p_init: 4.0
    learnable_p: false
    alpha_jitter: 0.0
  - name: dytc_plearnable
    norm: dytc
    p_init: 2.0
    learnable_p: true
    alpha_jitter: 0.0
  - name: dytc_hardtanh_eq
    norm: dytc
    p_init: 64.0
    learnable_p: false
    alpha_jitter: 0.0


  - name: dyt_alpha_0.3
    norm: dyt
    alpha_init: 0.3
  - name: dyt_alpha_0.5
    norm: dyt
    alpha_init: 0.5
  - name: dyt_alpha_1.0
    norm: dyt
    alpha_init: 1.0
