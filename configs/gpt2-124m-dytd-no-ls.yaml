# Phase 1 controlled companion to configs/gpt2-124m-dytd.yaml: the identical
# recipe with the LayerScale residual gate switched off, so the depth-decay
# component of the DyT-D axis is isolated from "depth decay + LayerScale"
# (the contrast the ablation matrix runs at 1000 steps as `dytd_full` vs
# `dytcd_no_ls`-style rows). Compare against gpt2-124m-dytd.yaml to attribute
# a delta to the LayerScale residual alone.
model: gpt2-124m
norm: dytd
alpha_0: 0.9
k_init: 1.0
learnable_k: true
qk_norm: null
use_layerscale: false

seeds: [42, 43, 44]

dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: gpt2
seq_len: 1024
batch_size: 32
grad_accum: 4

max_steps: 10000
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

output_dir: runs/gpt2-124m-dytd-no-ls
log_every: 20
stats_every: 500
save_every: 2000
