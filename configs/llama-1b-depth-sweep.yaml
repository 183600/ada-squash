# LLaMA-tiny 1.1B with depth sweep launcher
# Use the launcher: python scripts/train_llama_depth_sweep.py --config configs/llama-1b-depth-sweep.yaml
model: llama-1b
depths: [12, 24, 48, 96]
norms: [rmsnorm, dyt, dytcd]

# DyT-D / DyT-CD specific
alpha_0: 0.9
k_init: 1.0
alpha_init: 0.5        # only used by dyt / dytc
p_init: 2.0
learnable_p: true
learnable_k: true
use_layerscale: true
layerscale_init: 1.0e-5

# Data
dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: HuggingFaceFW/fineweb-edu/llama-tokenizer
seq_len: 2048
batch_size: 8
grad_accum: 8

# Optimizer
max_steps: 5000
lr: 3.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

# Logging
output_dir: runs/depth-sweep
log_every: 20
stats_every: 500
save_every: 1000
