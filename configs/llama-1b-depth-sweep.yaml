model: llama-1b
depths: [12, 24, 48, 96]
# dytdi = depth-init control: plain DyT initialized at the DyT-D schedule.
# The depth claims need it - without dytd vs dytdi the "depth-conditioning"
# axis cannot distinguish the reparameterization from a better init.
norms: [rmsnorm, dyt, dytcd, dytdi]

# Every (depth, norm) cell is replicated over these independent seeds and the
# launcher reports Mean +/- Std across runs for both validation statistics:
# best_val_loss (min over validation passes, the checkpoint-selection number,
# optimistically biased) and final_val_loss (last validation pass, the
# fixed-step estimate cells are compared on). A single run cannot separate a
# depth/norm effect from run-to-run noise, so the shipped sweep uses three
# seeds.
seeds: [42, 43, 44]

alpha_0: 0.9
k_init: 1.0
alpha_init: 0.5
p_init: 2.0
learnable_p: true
learnable_k: true
use_layerscale: true
layerscale_init: 1.0e-5

dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: huggyllama/llama-7b
seq_len: 2048
batch_size: 8
grad_accum: 8

max_steps: 5000
lr: 3.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

output_dir: runs/depth-sweep
log_every: 20
stats_every: 500
save_every: 1000
