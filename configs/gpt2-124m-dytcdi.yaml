model: gpt2-124m
# DyTCDI: depth-*init* control for DyT-CD - DyT-C whose per-channel alpha is
# initialized at the DyT-CD schedule value (delta=0) and learned freely.
# dytcd vs dytcdi isolates the reparameterization from the init prior.
norm: dytcdi
alpha_0: 0.9
k_init: 1.0
p_init: 2.0
learnable_p: true
qk_norm: null
use_layerscale: true
layerscale_init: 1.0e-5

dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: gpt2
seq_len: 1024
batch_size: 32
grad_accum: 4

max_steps: 10000
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

# Held-out validation: wikitext-103 test is disjoint from the FineWeb-Edu
# training stream, so val_loss is never computed on data the model trained on.
val_every: 500
val_batches: 16
val_dataset: Salesforce/wikitext
val_dataset_config: wikitext-103-raw-v1
val_split: test

output_dir: runs/gpt2-124m-dytcdi
log_every: 20
stats_every: 500
save_every: 2000
