model: gpt2-124m
norm: dytd
alpha_0: 0.9
k_init: 1.0
learnable_k: true
qk_norm: null
# LayerScale on and layerscale_init set: per docs/design_notes.md the DyT-D
# depth axis *is* "depth-decaying alpha + LayerScale residual", so this is the
# variant's intrinsic mechanism, not a controlled variable. Comparing this
# row against dyt / dytc therefore changes the norm and LayerScale together;
# configs/gpt2-124m-dytd-no-ls.yaml is the LayerScale-controlled companion
# that isolates the depth-decay component.
use_layerscale: true
layerscale_init: 1.0e-5

# Phase 1 statistics: each variant is replicated over these training seeds,
# every seed a full independent run under <output_dir>/seed{N}/; the launcher
# aggregates Mean +/- Std across seeds into <output_dir>/aggregate.json.
# Seeds are the unit of replication (>= 3), because one run cannot separate
# the normalization effect from run-to-run noise. Pass `--seeds <one>` for the
# single-run layout in place, or the `--seed N` shorthand.
hypothesis: Depth-decaying alpha plus LayerScale improves held-out loss over scalar tanh DyT at matched activation.

seeds: [42, 43, 44]

dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: gpt2
seq_len: 1024
batch_size: 32
grad_accum: 4

max_steps: 10000
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

output_dir: runs/gpt2-124m-dytd
log_every: 20
stats_every: 500
save_every: 2000

# Held-out validation: wikitext-103 test is disjoint from the FineWeb-Edu
# training stream, so val_loss is never computed on data the model trained on.
val_every: 500
val_batches: 16
val_dataset: Salesforce/wikitext
val_dataset_config: wikitext-103-raw-v1
val_split: test
