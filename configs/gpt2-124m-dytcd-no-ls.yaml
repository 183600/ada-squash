# Phase 1 controlled companion to configs/gpt2-124m-dytcd.yaml: the identical
# recipe with the LayerScale residual gate switched off, so dytcd-vs-dytcd-no-ls
# isolates the LayerScale residual alone and dytcd-no-ls-vs-dytcd-no-ls
# style contrasts (against the single-axis rows) do not carry the LayerScale
# confound. The main comparison table keeps the intrinsic row
# (gpt2-124m-dytcd.yaml); this companion makes "how much of the gain is the
# gate?" testable at the Phase 1 scale, matching the ablation matrix's
# `dytcd_no_ls` row at 1000 steps.
model: gpt2-124m
norm: dytcd
alpha_0: 0.9
k_init: 1.0
learnable_k: true
p_init: 2.0
learnable_p: true
qk_norm: null
use_layerscale: false

seeds: [42, 43, 44]

dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
tokenizer: gpt2
seq_len: 1024
batch_size: 32
grad_accum: 4

max_steps: 10000
lr: 6.0e-4
min_lr_ratio: 0.1
warmup: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
bf16: true

output_dir: runs/gpt2-124m-dytcd-no-ls
log_every: 20
stats_every: 500
save_every: 2000
